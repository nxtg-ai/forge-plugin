name: Alpha evidence freeze

# DIRECTIVE-NXTG-20261014-08, condition 2 of EMMA-SOUL's alpha ruling (al:b675055c78cdb239).
# The marketplace installs main HEAD (the plugin source in marketplace.json is a relative path), so
# whatever lands on main reaches fresh installs. Until installs are pinned to a release tag, main must
# serve the plugin the alpha evidence ran on: eb5499d (v3.13.1). This fails any PR or push to main
# whose plugins/ or .claude-plugin/ tree differs from eb5499d's. It is a required check.
# The post-alpha PR that pins installs to a tag deletes this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  freeze:
    name: Alpha evidence freeze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: plugins/ and .claude-plugin/ trees equal eb5499d's
        env:
          PLUGINS_TREE: 22b37fa1983a6b7dd62bd4c1611c1adf2fb4551b
          MARKETPLACE_TREE: 33cb5cff38cd6897f8b7bd41a05d68df0693301f
        run: |
          # On a pull request, HEAD is the merge of the PR into main: the tree main would have.
          fail=0
          check() {
            got="$(git rev-parse "HEAD:$1")"
            if [ "$got" = "$2" ]; then
              echo "ok   $1 tree $got"
            else
              echo "::error::$1 tree is $got, expected $2 (eb5499d, v3.13.1). Changes to $1 are frozen until installs are pinned to a release tag (DIRECTIVE-NXTG-20261014-08)."
              fail=1
            fi
          }
          check plugins "$PLUGINS_TREE"
          check .claude-plugin "$MARKETPLACE_TREE"
          exit $fail
