name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  issues: write
  contents: read

jobs:
  validate:
    name: Validate Plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json
        run: |
          jq . .claude-plugin/plugin.json > /dev/null
          echo "plugin.json is valid JSON"

      - name: Validate hooks.json
        run: |
          jq . plugins/nxtg-forge/hooks/hooks.json > /dev/null
          echo "hooks.json is valid JSON"

      - name: Check required plugin structure
        run: |
          test -d plugins/nxtg-forge/commands && echo "commands/ exists"
          test -d plugins/nxtg-forge/agents && echo "agents/ exists"
          test -d plugins/nxtg-forge/skills && echo "skills/ exists"
          test -d plugins/nxtg-forge/hooks && echo "hooks/ exists"
          test -f plugins/nxtg-forge/servers/governance-mcp/index.mjs && echo "MCP server exists"

      - name: Create issue on CI failure
        uses: jayqi/failed-build-issue-action@v1
        if: failure() && github.event.pull_request == null
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        run: semgrep scan --config auto --json --output semgrep-results.json plugins/nxtg-forge/servers/governance-mcp/ || true

      - name: Check for high/critical findings
        run: |
          if [ -f semgrep-results.json ]; then
            HIGH_COUNT=$(jq '[.results[] | select(.extra.severity == "ERROR" or .extra.severity == "WARNING")] | length' semgrep-results.json 2>/dev/null || echo "0")
            echo "Semgrep findings (high+critical): $HIGH_COUNT"
            if [ "$HIGH_COUNT" -gt 0 ]; then
              jq '.results[] | select(.extra.severity == "ERROR" or .extra.severity == "WARNING") | "\(.extra.severity) \(.check_id) \(.path):\(.start.line)"' semgrep-results.json
            fi
          fi

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30

      - name: Create issue on CI failure
        uses: jayqi/failed-build-issue-action@v1
        if: failure() && github.event.pull_request == null
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  mcp-server:
    name: MCP Server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install MCP server dependencies
        working-directory: plugins/nxtg-forge/servers/governance-mcp
        run: npm install

      - name: Validate MCP server imports
        working-directory: plugins/nxtg-forge/servers/governance-mcp
        env:
          FORGE_TEST_MODE: '1'
        run: node -e "import('./index.mjs').then(() => console.log('MCP server imports OK')).catch(e => { console.error(e); process.exit(1); })"

      - name: Run governance-mcp tests
        working-directory: plugins/nxtg-forge/servers/governance-mcp
        env:
          FORGE_TEST_MODE: '1'
        run: node --test __tests__/health.test.mjs

      - name: Create issue on CI failure
        uses: jayqi/failed-build-issue-action@v1
        if: failure() && github.event.pull_request == null
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
