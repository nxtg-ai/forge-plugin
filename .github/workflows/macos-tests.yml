name: macOS tests

# Our other CI runs on Linux only. On macOS, vitest once failed 17 tests that passed on Linux (#124): a
# guard bug on symlinked paths and tests that assumed GNU tools. This job keeps macOS green. It fails on
# any test failure and lists every failing test, with its first error lines, in the run summary.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest-macos:
    name: vitest on macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: plugins/nxtg-forge/servers/governance-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        env:
          FORGE_TEST_MODE: '1'
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-macos.json

      - name: List failing tests in the run summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const out = process.env.GITHUB_STEP_SUMMARY;
            if (!fs.existsSync("vitest-macos.json")) { fs.appendFileSync(out, "vitest wrote no report\n"); process.exit(0); }
            const r = JSON.parse(fs.readFileSync("vitest-macos.json", "utf8"));
            const lines = [`## vitest on macOS: ${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numPendingTests} skipped`, ""];
            for (const f of r.testResults) for (const t of f.assertionResults) if (t.status === "failed") {
              lines.push(`- \`${f.name.split("governance-mcp/")[1]}\` > ${t.fullName}`);
              lines.push("  ```", "  " + String((t.failureMessages || [""])[0]).split("\n").slice(0, 6).join("\n  "), "  ```");
            }
            fs.appendFileSync(out, lines.join("\n") + "\n");
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-macos
          path: plugins/nxtg-forge/servers/governance-mcp/vitest-macos.json
